[project]
name = "voice-fault-diagnosis"
version = "0.1.0"
description = "Local-file acoustic fault diagnosis system for VK701N-SD voiceprint voltage acquisition."
requires-python = ">=3.10,<3.13"
dependencies = [
    # Keep the legacy audio/model stack on NumPy 1.x for LubanCat ARM64.
    "numpy>=1.26.0,<2.0",
    "scipy>=1.11.4,<1.13",
    "librosa>=0.10.1,<0.11",
    # PyPI provides Linux aarch64 wheels from torch 2.8 onward.
    "torch>=2.8,<2.13",
]

[project.optional-dependencies]
desktop = [
    # The full PySide6 meta-package pulls Addons too; this app only needs Core/Gui/Widgets.
    "PySide6_Essentials==6.7.3; platform_system == 'Linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "PySide6>=6.7,<6.11; platform_system != 'Linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",
]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
